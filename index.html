<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Formation</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --panel-bg: #2a2a2a;
      --accent: #2ecc71;
      --accent-hover: #27ae60;
      --text: #ffffff;
      --field-green: #2e7d32;
      --field-line: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }

    .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 15px 20px; border-radius: 8px; margin-bottom: 10px; gap: 15px; }
    .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    
    select, button, input { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 5px; font-size: 14px; }
    button { background: var(--accent); border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }

    /* Campo da Gioco */
    .field-container { background: var(--field-green); border: 4px solid #fff; border-radius: 10px; height: 600px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 10px; }
    .field-line-center { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--field-line); }
    .field-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; border: 2px solid var(--field-line); border-radius: 50%; }

    .line { display: flex; justify-content: space-around; align-items: center; z-index: 2; width: 100%; }
    
    .player-card { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .player-icon { width: 35px; height: 35px; background: #e74c3c; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-shadow: 1px 1px 2px #000; }
    .player-card.por .player-icon { background: #f39c12; }
    .player-input { width: 95px; text-align: center; padding: 4px; font-size: 11px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; }

    /* Sidebar Panchina e Cambi */
    .sidebar { background: var(--panel-bg); padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 20px; }
    .bench-section, .sub-section { display: flex; flex-direction: column; gap: 10px; }
    
    .bench-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .bench-item { display: flex; align-items: center; gap: 8px; }
    .bench-item span { width: 30px; font-size: 12px; font-weight: bold; color: #aaa; }
    .bench-item input { flex: 1; }

    .sub-box { background: #333; padding: 15px; border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
    .sub-box label { font-size: 12px; color: #ccc; }
    .sub-box select { width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Gestione Formazione</h1>
    <div class="controls">
      <div>
        <label for="mode-select">Modalità: </label>
        <select id="mode-select" onchange="updateMode()">
          <option value="11">Calcio a 11</option>
          <option value="8">Calcio a 8</option>
          <option value="7">Calcio a 7</option>
          <option value="5" selected>Calcio a 5 (Futsal)</option>
        </select>
      </div>
      <div>
        <label for="formation-select">Modulo: </label>
        <select id="formation-select" onchange="changeFormation()"></select>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Campo Titolari -->
    <div class="field-container" id="field">
      <div class="field-line-center"></div>
      <div class="field-circle"></div>
    </div>

    <!-- Sidebar Panchina & Cambi -->
    <div class="sidebar">
      <div class="bench-section">
        <h3>Panchina (Sostituti)</h3>
        <div class="bench-list" id="bench-list"></div>
      </div>

      <hr style="border-color: #444;">

      <div class="sub-section">
        <h3>Effettua Cambio 🔄</h3>
        <div class="sub-box">
          <div>
            <label>Esci (Titolare):</label>
            <select id="sub-out-select"></select>
          </div>
          <div>
            <label>Entra (Panchina):</label>
            <select id="sub-in-select"></select>
          </div>
          <button onclick="makeSubstitution()">Conferma Cambio</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configurazione dei moduli divisa per dimensione squadra
    const allFormations = {
      '5': {
        '1-2-1 (Rombo)': [
          { labels: ['PIV'] },
          { labels: ['LAT-S', 'LAT-D'] },
          { labels: ['DIF'] },
          { labels: ['POR'] }
        ],
        '2-2 (Quadrato)': [
          { labels: ['ATT', 'ATT'] },
          { labels: ['DIF', 'DIF'] },
          { labels: ['POR'] }
        ],
        '3-1 (Piramide)': [
          { labels: ['PIV'] },
          { labels: ['LAT-S', 'MED', 'LAT-D'] },
          { labels: ['POR'] }
        ],
        '4-0 (Totale)': [
          { labels: ['LAT-S', 'CEN', 'CEN', 'LAT-D'] },
          { labels: ['POR'] }
        ]
      },
      '7': {
        '2-3-1': [
          { labels: ['ATT'] },
          { labels: ['E-S', 'CEN', 'E-D'] },
          { labels: ['DC', 'DC'] },
          { labels: ['POR'] }
        ],
        '3-2-1': [
          { labels: ['ATT'] },
          { labels: ['CC', 'CC'] },
          { labels: ['TS', 'DC', 'TD'] },
          { labels: ['POR'] }
        ],
        '2-2-2': [
          { labels: ['ATT', 'ATT'] },
          { labels: ['CC', 'CC'] },
          { labels: ['DC', 'DC'] },
          { labels: ['POR'] }
        ]
      },
      '8': {
        '3-3-1': [
          { labels: ['ATT'] },
          { labels: ['E-S', 'CC', 'E-D'] },
          { labels: ['TS', 'DC', 'TD'] },
          { labels: ['POR'] }
        ],
        '2-4-1': [
          { labels: ['ATT'] },
          { labels: ['E-S', 'CC', 'CC', 'E-D'] },
          { labels: ['DC', 'DC'] },
          { labels: ['POR'] }
        ],
        '3-2-2': [
          { labels: ['ATT', 'ATT'] },
          { labels: ['CC', 'CC'] },
          { labels: ['TS', 'DC', 'TD'] },
          { labels: ['POR'] }
        ]
      },
      '11': {
        '4-3-3': [
          { labels: ['AS', 'ATT', 'AD'] },
          { labels: ['CC', 'MED', 'CC'] },
          { labels: ['TS', 'DC', 'DC', 'TD'] },
          { labels: ['POR'] }
        ],
        '4-4-2': [
          { labels: ['ATT', 'ATT'] },
          { labels: ['CS', 'CC', 'CC', 'CD'] },
          { labels: ['TS', 'DC', 'DC', 'TD'] },
          { labels: ['POR'] }
        ],
        '3-5-2': [
          { labels: ['ATT', 'ATT'] },
          { labels: ['E-S', 'CC', 'MED', 'CC', 'E-D'] },
          { labels: ['DC', 'DC', 'DC'] },
          { labels: ['POR'] }
        ],
        '4-2-3-1': [
          { labels: ['ATT'] },
          { labels: ['TRQ', 'TRQ', 'TRQ'] },
          { labels: ['MED', 'MED'] },
          { labels: ['TS', 'DC', 'DC', 'TD'] },
          { labels: ['POR'] }
        ]
      }
    };

    const BENCH_SIZE = 7;

    window.onload = () => {
      renderBench();
      updateMode();
    };

    // Cambia la modalità (5, 7, 8, 11) e ripopola la select dei moduli
    function updateMode() {
      const mode = document.getElementById('mode-select').value;
      const formationSelect = document.getElementById('formation-select');
      
      formationSelect.innerHTML = '';
      const availableFormations = Object.keys(allFormations[mode]);

      availableFormations.forEach(formName => {
        const option = document.createElement('option');
        option.value = formName;
        option.textContent = formName;
        formationSelect.appendChild(option);
      });

      changeFormation();
    }

    // Cambia la disposizione in campo
    function changeFormation() {
      const mode = document.getElementById('mode-select').value;
      const formationName = document.getElementById('formation-select').value;
      const layout = allFormations[mode][formationName];
      const field = document.getElementById('field');

      if (!layout) return;

      // Preserva i nomi già inseriti
      const existingNames = {};
      document.querySelectorAll('.starter-input').forEach(input => {
        if (input.value) existingNames[input.dataset.id] = input.value;
      });

      field.innerHTML = '<div class="field-line-center"></div><div class="field-circle"></div>';

      let globalIndex = 0;

      layout.forEach(row => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';

        row.labels.forEach(label => {
          globalIndex++;
          const id = `starter-${globalIndex}`;
          const playerCard = document.createElement('div');
          playerCard.className = `player-card ${label === 'POR' ? 'por' : ''}`;
          
          playerCard.innerHTML = `
            <div class="player-icon">${label}</div>
            <input type="text" 
                   class="player-input starter-input" 
                   id="${id}" 
                   data-id="${id}"
                   data-role="${label}"
                   placeholder="Giocatore" 
                   value="${existingNames[id] || ''}" 
                   oninput="updateSubDropdowns()">
          `;
          lineDiv.appendChild(playerCard);
        });

        field.appendChild(lineDiv);
      });

      updateSubDropdowns();
    }

    function renderBench() {
      const benchContainer = document.getElementById('bench-list');
      benchContainer.innerHTML = '';

      for (let i = 1; i <= BENCH_SIZE; i++) {
        const item = document.createElement('div');
        item.className = 'bench-item';
        item.innerHTML = `
          <span>P${i}</span>
          <input type="text" 
                 class="bench-input" 
                 id="bench-${i}" 
                 placeholder="Riserva ${i}" 
                 oninput="updateSubDropdowns()">
        `;
        benchContainer.appendChild(item);
      }
    }

    function updateSubDropdowns() {
      const outSelect = document.getElementById('sub-out-select');
      const inSelect = document.getElementById('sub-in-select');

      const currentOut = outSelect.value;
      const currentIn = inSelect.value;

      outSelect.innerHTML = '';
      inSelect.innerHTML = '';

      document.querySelectorAll('.starter-input').forEach(input => {
        const name = input.value.trim() || `[Vuoto] (${input.dataset.role})`;
        const option = document.createElement('option');
        option.value = input.id;
        option.textContent = `${input.dataset.role}: ${name}`;
        outSelect.appendChild(option);
      });

      document.querySelectorAll('.bench-input').forEach((input, index) => {
        const name = input.value.trim() || `Panchina ${index + 1}`;
        const option = document.createElement('option');
        option.value = input.id;
        option.textContent = name;
        inSelect.appendChild(option);
      });

      if (currentOut) outSelect.value = currentOut;
      if (currentIn) inSelect.value = currentIn;
    }

    function makeSubstitution() {
      const outId = document.getElementById('sub-out-select').value;
      const inId = document.getElementById('sub-in-select').value;

      if (!outId || !inId) return;

      const outInput = document.getElementById(outId);
      const inInput = document.getElementById(inId);

      const temp = outInput.value;
      outInput.value = inInput.value;
      inInput.value = temp;

      updateSubDropdowns();
    }
  </script>
</body>
</html>
